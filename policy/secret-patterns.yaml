schema: secret_patterns.v1
patterns:
  - { id: private-key, regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----' }
  - { id: aws-key, regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b' }
  - { id: github-token, regex: '\bgh[pousr]_[A-Za-z0-9]{30,}\b' }
  - { id: github-pat, regex: '\bgithub_pat_[A-Za-z0-9_]{22,}\b' }
  - { id: openai-key, regex: '\bsk-(proj-)?[A-Za-z0-9_-]{20,}\b' }
  - { id: anthropic-key, regex: '\bsk-ant-[A-Za-z0-9_-]{20,}\b' }
  - { id: slack-token, regex: '\bxox[abprs]-[A-Za-z0-9-]{10,}\b' }
  - { id: google-key, regex: '\bAIza[0-9A-Za-z_-]{35}\b' }
  - { id: literal-credential, regex: '\b([Pp]assword|PASSWORD|[Tt]oken|TOKEN)=["'']?[A-Za-z0-9_+/.-]{16,}' }
